<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bescuit 成本追踪 - 离线模式</title>
    <meta name="theme-color" content="#f6f1e8" />
    <style>
      :root {
        color-scheme: light;
        --primary: #d67a3f;
        --bg: #f6f1e8;
        --panel: rgba(255, 252, 247, 0.94);
        --text: #433831;
        --muted: #6b6056;
        --border: rgba(120, 104, 86, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family:
          Manrope,
          ui-sans-serif,
          system-ui,
          sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(214, 122, 63, 0.14), transparent 34%),
          linear-gradient(180deg, #fbf7f1 0%, var(--bg) 46%, #efe6d9 100%);
      }

      main {
        width: min(100%, 38rem);
        padding: 1.5rem;
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--panel);
        box-shadow: 0 24px 60px rgba(109, 87, 63, 0.1);
      }

      p {
        margin: 0;
        line-height: 1.7;
        color: var(--muted);
      }

      h1 {
        margin: 0.6rem 0 0.9rem;
        font-size: clamp(2rem, 6vw, 3rem);
        line-height: 1;
      }

      a {
        display: inline-flex;
        margin-top: 1rem;
        padding: 0.85rem 1.1rem;
        border-radius: 999px;
        background: linear-gradient(145deg, var(--primary), #b7612d);
        color: #fffaf4;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p>离线模式</p>
      <h1>Bescuit 成本追踪暂时离线。</h1>
      <p>
        已缓存的页面仍可访问。同步发票、分析刷新和写入 Cloudflare 等依赖网络的操作将在恢复连接后继续。
      </p>
      <a href="/">重新尝试打开仪表盘</a>
    </main>
  </body>
</html>
